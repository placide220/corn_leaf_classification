# =====================================================================================
# nginx load balancer in front of the API replicas
#
# `docker compose up --scale api=4` starts 4 API containers that all share the DNS name
# "api". nginx asks Docker's DNS for that name, gets every replica's IP address, and
# spreads incoming requests across them. Clients only ever talk to nginx on port 8000.
# =====================================================================================

worker_processes auto;

events {
    worker_connections 4096;            # max simultaneous connections per nginx worker
}

http {
    # Docker's built-in DNS server. valid=5s = re-check every 5 s, so replicas added or
    # removed with --scale are picked up without restarting nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Log which replica served each request (upstream=...) and how long it took (rt=...)
    log_format upstreamlog '$remote_addr "$request" $status upstream=$upstream_addr '
                           'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log upstreamlog;

    upstream api_backend {
        # least_conn: send each new request to the replica with the fewest requests in
        # progress. Better than plain round-robin when some requests (predictions, uploads)
        # take longer than others.
        least_conn;

        # Shared memory zone + `resolve` (nginx >= 1.27.3) let nginx keep the replica list
        # up to date from DNS.
        zone api_backend 64k;
        server api:8000 resolve max_fails=3 fail_timeout=10s;

        keepalive 64;                    # reuse connections to the replicas (lower latency)
        keepalive_timeout 60s;           # must be SHORTER than uvicorn's --timeout-keep-alive (75 s)
    }

    server {
        listen 80;

        # Bulk uploads (zip files of images) can be large
        client_max_body_size 250m;

        # nginx's own liveness check (does not touch the API)
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";              # needed for upstream keepalive
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Retraining requests and large uploads can be slow, so allow up to 5 minutes
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # If a replica is down or restarting, retry the request on another one
            # (only for safe errors, never twice for the same POST that already started)
            proxy_next_upstream error timeout http_502 http_503;

            # Tell the client which replica answered (useful in the demo and in Locust)
            add_header X-Upstream $upstream_addr always;
            add_header X-Instance $upstream_addr always;
        }
    }
}
